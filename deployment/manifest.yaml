schema_version: 2
project: hve-life-os
release_channel: alpha

# ── Deployment context ────────────────────────────────────────────────
# Active reference target = DGX Spark. Mercury is PARKED (experimental edge
# target); its files live under deployment/mercury/ and docs/*-mercury.md and
# are preserved, not deleted. See AGENTS.md / PROJECT_STATUS.md.
#
# Directory containment: every HVE-owned artifact lives under ~/hve-life-os.
# No HVE files in /usr/bin, /etc, /opt, system Python, or system services.
# Ollama is NOT in the HVE dependency graph.


upstream:
  name: NousResearch/hermes-agent
  pinned: true
  note: >
    Pinned upstream revision and model checksum are enforced in the runtime
    MANIFEST (~/hve-life-os/MANIFEST.yaml). Do not run from an unpinned branch.

# ── Model ────────────────────────────────────────────────────────────
model:
  name: Qwen3.8-2B-Distill
  family: qwen3.8
  format: gguf
  quantization: Q4_K_M
  context_tokens: 65536          # exact (not 64448)
  max_output_tokens: 1024        # initial bound; raise only by explicit change
  backend: llama.cpp             # separate, Ollama-independent build
  endpoint: http://127.0.0.1:8089/v1
  bind_default: 127.0.0.1        # loopback only by default
  bind_lan: opt-in               # explicit, documented, human-approved only
  artifact_path: ~/hve-life-os/models/Qwen3.8-2B-Distill-Q4_K_M.gguf
  checksum: 4aa0fb13c431514262f259d420ecc95a8714df58ac2a2384514e20b93983f0ff
  checksum_algorithm: sha256
  # Verified on the Spark (task 2026-08-23): sha256sum of the GGUF equals the
  # value above (artifact present at the source path under ~/models/3rdparty/
  # qwen3.8/2b/). Re-verification command in docs/runbook-spark.md.


# ── Deployment root ──────────────────────────────────────────────────
deployment_root: ~/hve-life-os
runtime:
  python: self-contained-venv    # under ~/hve-life-os/env, NOT system python
  supervisor: none-default       # standalone process; no systemd by default
  network: loopback-only-by-default

# ── Targets ──────────────────────────────────────────────────────────
targets:
  spark:
    status: alpha                # active reference (this mission)
    architecture: aarch64        # GB10, 128 GB unified
    gpu: cpu-neon                # GB10 is not a CUDA device for llama.cpp
  mercury:
    status: experimental         # PARKED — edge target; files preserved
    path: deployment/mercury

  ubuntu-windows:
    status: planned
  macos:
    status: planned

# ── Overlay / portability contract ───────────────────────────────────
overlay:
  # Context floor no longer needed: a truthful 65536-token model satisfies the
  # native Hermes minimum. The Mercury context-floor patch
  # (patches/hermes-context-floor.patch) is archived, not active.
  system_manager: standalone     # Spark; Mercury used systemd (parked)
  loopback_only: true

